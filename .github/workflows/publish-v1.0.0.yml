name: Publish immutable v1.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.0.yml

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish v1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require final-main CI at exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in verify.yml pdf.yml; do
            passed=false
            for attempt in $(seq 1 90); do
              runs="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"
              conclusion="$(jq -r \
                '[.workflow_runs[] | select(.head_branch == "main")][0].conclusion // "pending"' \
                <<<"$runs")"
              status="$(jq -r \
                '[.workflow_runs[] | select(.head_branch == "main")][0].status // "pending"' \
                <<<"$runs")"
              if [[ "$status" == completed && "$conclusion" == success ]]; then
                echo "${workflow}: PASS at ${GITHUB_SHA}"
                passed=true
                break
              fi
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                echo "${workflow}: ${conclusion} at ${GITHUB_SHA}" >&2
                exit 1
              fi
              sleep 10
            done
            if [[ "$passed" != true ]]; then
              echo "${workflow}: timed out waiting for exact-head success" >&2
              exit 1
            fi
          done

      - name: Verify repository and deterministic evidence
        run: bash scripts/verify_public_repo.sh

      - name: Stage and hash-check immutable assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp paper/manuscript.pdf dist/random-series-parallel-distance-exponent-v1.0.0.pdf
          cp paper/manuscript.tex dist/random-series-parallel-distance-exponent-v1.0.0.tex
          cp paper/references.bib dist/references.bib
          cp CITATION.cff dist/CITATION.cff
          cp release/EVIDENCE_BUNDLE.zip dist/random-series-parallel-distance-exponent-public-evidence-v1.0.0.zip
          cp release/RELEASE_ASSET_SHA256SUMS.txt dist/RELEASE_ASSET_SHA256SUMS.txt
          (cd dist && sha256sum -c RELEASE_ASSET_SHA256SUMS.txt)

      - name: Write release notes
        shell: bash
        run: |
          cat > /tmp/release-body.md <<EOF
          # Version 1.0.0

          ## Result

          For every fixed \`p in (1/2,1)\`, the random series-parallel expected-distance growth factor is the attained maximal eigenvalue of an explicit homogeneous sum/min operator on normalized quantile profiles. The same value is given by matching lower and upper Collatz--Wielandt formulas and a compatible invariant-measure variational formula.

          Prior work supplies the critical endpoint \`delta(1/2)=0\`, and the all-series endpoint \`delta(1)=log 2\` is elementary. This release contributes the all-interior model-specific characterization; it does not claim a new generic nonlinear Perron--Frobenius theorem.

          ## Scope and status

          The mathematical audit, three priority-search lanes, exact-source PDF build, deterministic evidence verification, and page-by-page visual preflight are complete. The model-specific assembly is described as apparently new after a documented search through 2026-08-09, with moderate confidence. Absolute historical priority, human peer review, and formal verification are not claimed.

          The immutable tag targets public \`main\` commit \`${GITHUB_SHA}\`. The protected release PR passed the repository-evidence and PDF-build checks before merge, and both final-\`main\` push workflows passed at this exact release commit before publication.

          ## Immutable assets

          - \`random-series-parallel-distance-exponent-v1.0.0.pdf\`
          - \`random-series-parallel-distance-exponent-v1.0.0.tex\`
          - \`references.bib\`
          - \`CITATION.cff\`
          - \`RELEASE_ASSET_SHA256SUMS.txt\`
          - \`random-series-parallel-distance-exponent-public-evidence-v1.0.0.zip\`

          The checksum ledger records the exact hashes of the other five assets. The evidence ZIP is deterministic and contains its own verified manifest and SHA-256 ledger.

          No DOI is claimed by this GitHub release. Any archival DOI deposit is a separate post-release action.
          EOF

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view v1.0.0 \
            --json databaseId,isDraft,targetCommitish 2>/dev/null || true)"
          if [[ -n "$release_json" ]]; then
            is_draft="$(jq -r .isDraft <<<"$release_json")"
            target="$(jq -r .targetCommitish <<<"$release_json")"
            if [[ "$is_draft" != true || "$target" != "$GITHUB_SHA" ]]; then
              echo "v1.0.0 already exists outside the recoverable exact-head draft state" >&2
              exit 1
            fi
            echo "Removing an incomplete exact-head draft before retry"
            gh release delete v1.0.0 --yes --cleanup-tag
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" >/dev/null 2>&1; then
            echo "tag v1.0.0 already exists; refusing to attach the release to an unverified tag" >&2
            exit 1
          fi
          gh release create v1.0.0 dist/* \
            --target "$GITHUB_SHA" \
            --title "Version 1.0.0" \
            --notes-file /tmp/release-body.md

      - name: Verify immutable release, exact tag, and downloaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view v1.0.0 \
            --json isDraft,isImmutable,tagName,targetCommitish,url)"
          is_draft="$(jq -r .isDraft <<<"$release_json")"
          is_immutable="$(jq -r .isImmutable <<<"$release_json")"
          tag_name="$(jq -r .tagName <<<"$release_json")"
          if [[ "$is_draft" != false || "$is_immutable" != true || "$tag_name" != v1.0.0 ]]; then
            echo "release failed the published/immutable/tag postcondition" >&2
            if [[ "$is_immutable" != true ]]; then
              gh release delete v1.0.0 --yes --cleanup-tag || true
            fi
            exit 1
          fi

          tag_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" \
            --jq .object.sha)"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "tag resolves to ${tag_sha}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi

          mapfile -t remote_assets < <(gh release view v1.0.0 \
            --json assets --jq '.assets[].name' | LC_ALL=C sort)
          mapfile -t expected_assets < <(printf '%s\n' \
            CITATION.cff \
            RELEASE_ASSET_SHA256SUMS.txt \
            random-series-parallel-distance-exponent-public-evidence-v1.0.0.zip \
            random-series-parallel-distance-exponent-v1.0.0.pdf \
            random-series-parallel-distance-exponent-v1.0.0.tex \
            references.bib | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' "${expected_assets[@]}") \
            <(printf '%s\n' "${remote_assets[@]}")

          mkdir -p redownload
          gh release download v1.0.0 --dir redownload
          (cd redownload && sha256sum -c RELEASE_ASSET_SHA256SUMS.txt)
